plugins {
    id 'net.neoforged.moddev'
}

// ultimateneo: common is compiled against the NeoForge-patched Minecraft with ModDevGradle
// (previously Fabric Loom). The access widener entries are mirrored by the NeoForge AT.
neoForge {
    version = project.neoforge_version
    accessTransformers.from(rootProject.file('neoforge/src/main/resources/META-INF/accesstransformer.cfg'))
}

dependencies {
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")

    api("de.marhali:json5-java:${json5_version}")
    // pure-Java WebP decoder (MPL-2.0); bundled jar-in-jar by each loader
    api("org.glavo:webp:${jwebp_version}")

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Loom put Minecraft and its libraries on the test classpath; mirror that for the plain JUnit tests.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
